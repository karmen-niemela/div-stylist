services:
  polisher:
    build:
      context: .
      dockerfile: Dockerfile
    image: one-div-polisher:latest
    container_name: one-div-polisher
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
