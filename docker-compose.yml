services:
  polisher:
    build:
      context: .
      dockerfile: Dockerfile
    image: one-div-polisher:latest
    container_name: one-div-polisher
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
